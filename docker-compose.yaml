     # - PGADMIN_DEFAULT_PASSWORD=$

admin:
    image: dpage/pgadmin4:latest
    container_name: 69-s2-admin
     ports:
      - 8082:80
      environment:
      - PGADMIN_DEFAULT_EMAIL=$
      - PGADMIN_DEFAULT_PASSWORD=$

  volumes:
  data-postgres
