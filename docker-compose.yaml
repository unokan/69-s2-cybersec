services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - 54321:5432
    environment:
      - POSTGRES_PASSWORD=$
      - POSTGRES_USER=$
      - POSTGRES_DB=$
volumes:
      - ./data-postgres:/var/lib/postgresql/data

