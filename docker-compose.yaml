version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - 54321:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data-postgres:/var/lib/postgresql/data
    networks:
      - pg-network

  admin:
    image: dpage/pgadmin4:latest
    container_name: 69-s2-admin
    ports:
      - 8082:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    user: root
    depends_on:
      - db
    networks:
      - pg-network

volumes:
  pgadmin-data:

networks:
  pg-network:
    driver: bridge

    version: '3.8'

services:
  # 1. บริการฐานข้อมูล (Database)
  69-s2-db:
    image: postgres:15-alpine
    container_name: 69-s2-db
    restart: always
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapiSecurePassword123
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. บริการจัดระบบหลังบ้าน / จัดการ DB (Admin)
  69-s2-admin:
    image: dpage/pgadmin4:latest
    container_name: 69-s2-admin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminPassword123
    ports:
      - "8080:80"
    depends_on:
      - 69-s2-db
    networks:
      - app-network

  # 3. บริการแอปพลิเคชัน Strapi (App)
  69-s2-app:
    image: prawee/strapi
    container_name: 69-s2-app
    restart: always
    ports:
      - "9092:1337"  # แมป พอร์ต 9092 ของ Host ไปยังพอร์ต 1337 ของ Strapi
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: 69-s2-db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapiSecurePassword123
      DATABASE_SSL: "false"
      # ควรกำหนด Secret ต่างๆ เพื่อความปลอดภัย
      JWT_SECRET: aVerySecureJwtSecretKeyChangeMe123!
      ADMIN_JWT_SECRET: aVerySecureAdminJwtSecretKeyChangeMe123!
      APP_KEYS: key1,key2,key3,key4
      API_TOKEN_SALT: aVerySecureApiTokenSalt123!
    depends_on:
      - 69-s2-db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
